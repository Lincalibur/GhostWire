<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NIGHT CITY // UPLINK</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Share+Tech+Mono&display=swap');

:root{
  --black:#0A0A0F;
  --yellow:#FCEE0A;
  --cyan:#00E5FF;
  --magenta:#FF2A6D;
  --grey:#8B8B93;
  --red:#FF003C;
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  width:100%;height:100%;background:var(--black);overflow:hidden;
  font-family:'Chakra Petch',sans-serif;
}

#stage{
  position:relative;width:100%;height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center, #101018 0%, #0A0A0F 70%);
}

/* scanlines */
#stage::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(
    to bottom, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px,
    transparent 1px, transparent 3px
  );
  mix-blend-mode:overlay;
}

/* vignette */
#stage::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:4;
  box-shadow:inset 0 0 180px rgba(0,0,0,0.85);
}

/* terminal boot log */
#terminal{
  position:absolute;top:6%;left:6%;
  font-family:'Share Tech Mono',monospace;
  font-size:13px;line-height:1.7;color:var(--cyan);
  text-shadow:0 0 4px rgba(0,229,255,0.5);
  white-space:pre;
  opacity:0;
}
#terminal .ok{color:var(--yellow);}
#terminal .warn{color:var(--red);}
#terminal .dim{color:var(--grey);}

/* wordmark */
#wordmark-wrap{
  position:relative;text-align:center;z-index:3;
}
#wordmark{
  font-family:'Chakra Petch',sans-serif;
  font-weight:700;
  font-size:clamp(48px,9vw,120px);
  letter-spacing:6px;
  color:var(--yellow);
  text-transform:uppercase;
  position:relative;
  opacity:0;
}
#wordmark .layer{
  position:absolute;top:0;left:0;width:100%;
  opacity:0;mix-blend-mode:screen;
}
#wordmark .cyan-layer{color:var(--cyan);}
#wordmark .mag-layer{color:var(--magenta);}

#subline{
  margin-top:18px;
  font-family:'Share Tech Mono',monospace;
  font-size:14px;letter-spacing:5px;color:var(--grey);
  text-transform:uppercase;opacity:0;
}
#subline .accent{color:var(--red);}

/* HUD corner brackets */
.corner{
  position:absolute;width:36px;height:36px;border:2px solid var(--cyan);
  opacity:0;z-index:6;
}
.tl{top:24px;left:24px;border-right:none;border-bottom:none;}
.tr{top:24px;right:24px;border-left:none;border-bottom:none;}
.bl{bottom:24px;left:24px;border-right:none;border-top:none;}
.br{bottom:24px;right:24px;border-left:none;border-top:none;}

/* CTA */
#cta{
  position:absolute;bottom:14%;left:50%;transform:translateX(-50%);
  z-index:6;opacity:0;
}
#cta button{
  font-family:'Chakra Petch',sans-serif;font-weight:600;
  font-size:14px;letter-spacing:4px;text-transform:uppercase;
  background:transparent;color:var(--yellow);
  border:1px solid var(--yellow);padding:14px 34px;
  cursor:pointer;position:relative;
  transition:background .2s, color .2s;
}
#cta button:hover{background:var(--yellow);color:var(--black);}
#cta button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;}

/* flash overlay for glitch burst */
#flash{
  position:absolute;inset:0;background:#fff;opacity:0;z-index:8;pointer-events:none;
}

@keyframes blink{50%{opacity:0;}}
.cursor{display:inline-block;width:8px;height:14px;background:var(--cyan);
  animation:blink 1s step-end infinite;vertical-align:middle;margin-left:2px;}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important;}
}
</style>
</head>
<body>

<div id="stage">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div id="terminal"></div>

  <div id="wordmark-wrap">
    <h1 id="wordmark">
      <span class="base-layer">NIGHT CITY</span>
      <span class="layer cyan-layer">NIGHT CITY</span>
      <span class="layer mag-layer">NIGHT CITY</span>
    </h1>
    <div id="subline">SIGNAL ACQUIRED <span class="accent">// ENTER AT OWN RISK</span></div>
  </div>

  <div id="cta">
    <button id="enterBtn">Jack In</button>
  </div>

  <div id="flash"></div>
</div>

<script>
const bootLines = [
  { text: "INITIATING UPLINK...", cls: "" },
  { text: "NETWATCH TRACE DETECTED", cls: "warn" },
  { text: "REROUTING THROUGH PROXY_07", cls: "dim" },
  { text: "DECRYPTING PACKET...", cls: "" },
  { text: "ACCESS GRANTED", cls: "ok" },
];

const terminalEl = document.getElementById('terminal');
const wordmark = document.getElementById('wordmark');
const baseLayer = document.querySelector('.base-layer');
const cyanLayer = document.querySelector('.cyan-layer');
const magLayer = document.querySelector('.mag-layer');
const subline = document.getElementById('subline');
const corners = document.querySelectorAll('.corner');
const cta = document.getElementById('cta');
const flash = document.getElementById('flash');
const stage = document.getElementById('stage');

const CHARS = "!<>-_\\/[]{}—=+*^?#________";

function typeLine(el, text, speed=18){
  return new Promise(resolve=>{
    let i=0;
    const span = document.createElement('div');
    el.appendChild(span);
    const iv = setInterval(()=>{
      span.textContent = text.slice(0,i) + (i<text.length ? '_' : '');
      i++;
      if(i>text.length+1){ clearInterval(iv); span.textContent=text; resolve(); }
    }, speed);
  });
}

async function runBoot(){
  terminalEl.style.opacity = 1;
  for(const line of bootLines){
    const wrap = document.createElement('div');
    if(line.cls) wrap.className = line.cls;
    terminalEl.appendChild(wrap);
    await new Promise(res=>{
      let i=0;
      const iv = setInterval(()=>{
        wrap.textContent = line.text.slice(0,i);
        i++;
        if(i>line.text.length){ clearInterval(iv); res(); }
      }, 16);
    });
    await new Promise(r=>setTimeout(r, 120));
  }
  await new Promise(r=>setTimeout(r, 300));
  glitchBurst();
}

function glitchBurst(){
  flash.style.transition = 'opacity 60ms';
  flash.style.opacity = 0.7;
  setTimeout(()=>{
    flash.style.opacity = 0;
    terminalEl.style.transition = 'opacity 150ms';
    terminalEl.style.opacity = 0;
    decryptWordmark();
  }, 70);
}

function scrambleText(el, target, duration=700){
  return new Promise(resolve=>{
    const start = performance.now();
    function frame(now){
      const progress = Math.min((now-start)/duration, 1);
      const revealCount = Math.floor(progress * target.length);
      let out = '';
      for(let i=0;i<target.length;i++){
        if(target[i] === ' '){ out += ' '; continue; }
        if(i < revealCount){ out += target[i]; }
        else { out += CHARS[Math.floor(Math.random()*CHARS.length)]; }
      }
      el.textContent = out;
      if(progress < 1){ requestAnimationFrame(frame); }
      else { el.textContent = target; resolve(); }
    }
    requestAnimationFrame(frame);
  });
}

async function decryptWordmark(){
  wordmark.style.opacity = 1;
  cyanLayer.style.opacity = 0.6;
  magLayer.style.opacity = 0.6;

  // RGB-split settle animation
  cyanLayer.style.transition = 'transform 900ms cubic-bezier(.2,.8,.2,1), opacity 900ms';
  magLayer.style.transition = 'transform 900ms cubic-bezier(.2,.8,.2,1), opacity 900ms';
  cyanLayer.style.transform = 'translate(3px,-2px)';
  magLayer.style.transform = 'translate(-3px,2px)';

  await scrambleText(baseLayer, "NIGHT CITY", 650);
  // sync layers text
  cyanLayer.textContent = "NIGHT CITY";
  magLayer.textContent = "NIGHT CITY";

  setTimeout(()=>{
    cyanLayer.style.transform = 'translate(1px,-1px)';
    magLayer.style.transform = 'translate(-1px,1px)';
    cyanLayer.style.opacity = 0.35;
    magLayer.style.opacity = 0.35;
  }, 900);

  subline.style.transition = 'opacity 500ms';
  subline.style.opacity = 1;

  corners.forEach((c,i)=>{
    setTimeout(()=>{
      c.style.transition = 'opacity 400ms';
      c.style.opacity = 1;
    }, 200 + i*80);
  });

  setTimeout(()=>{
    cta.style.transition = 'opacity 500ms';
    cta.style.opacity = 1;
  }, 1000);

  // ambient flicker loop
  setInterval(()=>{
    if(Math.random() > 0.94){
      wordmark.style.opacity = 0.85;
      setTimeout(()=> wordmark.style.opacity = 1, 60);
    }
  }, 400);
}

document.getElementById('enterBtn').addEventListener('click', ()=>{
  flash.style.transition = 'opacity 80ms';
  flash.style.opacity = 1;
  setTimeout(()=>{ flash.style.opacity = 0; }, 150);
});

baseLayer.textContent = '';
cyanLayer.textContent = '';
magLayer.textContent = '';

runBoot();
</script>

</body>
</html>
