<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>GhostWire // Threshold Sequence</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #050505;
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
  }
  body.locked { overflow: hidden !important; }

  :root {
    --crimson: #d01212;
    --dark-bg: #050505;
    --text-dim: #888;
  }

  /* ============ PERSPECTIVE STAGE ============ */
  #perspective-wrap {
    position: fixed;
    inset: 0;
    perspective: 900px;
    overflow: hidden;
    background: #050505;
  }

  #scene {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-style: preserve-3d;
    transform-origin: 50% 46%;
    transition: transform 2.2s cubic-bezier(0.75, 0, 0.9, 1),
                filter 2.2s ease-in;
  }
  #scene.zooming {
    transform: translateZ(2400px);
    filter: blur(6px) brightness(2.2);
  }

  .scanline-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.3) 50%);
    background-size: 100% 4px;
    z-index: 40;
    pointer-events: none;
  }
  .grid-background {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(208,18,18,0.10) 1px, transparent 0);
    background-size: 24px 24px;
    opacity: 0.4;
    z-index: 1;
  }

  /* ============ DOOR ============ */
  #door-wrap {
    position: relative;
    width: 460px;
    height: 620px;
    z-index: 2;
  }

  #door-frame {
    position: absolute;
    inset: -10px;
    border: 3px solid rgba(208,18,18,0.85);
    box-shadow:
      0 0 50px rgba(208,18,18,0.45),
      0 0 90px rgba(208,18,18,0.2),
      inset 0 0 60px rgba(208,18,18,0.18);
    clip-path: polygon(50% 0%, 100% 10%, 100% 100%, 0% 100%, 0% 10%);
  }

  #door-light {
    position: absolute;
    inset: 4px;
    background: radial-gradient(ellipse at 50% 30%, rgba(208,18,18,0.55), rgba(208,18,18,0.12) 60%, transparent 85%);
    opacity: 0.75;
    animation: door-breathe 5s ease-in-out infinite;
    z-index: 1;
  }
  @keyframes door-breathe {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 0.9; }
  }

  .door-panel {
    position: absolute;
    top: 4px;
    bottom: 4px;
    width: 50%;
    background: linear-gradient(180deg, #1c1414, #120c0c 60%, #0a0606);
    z-index: 2;
    transition: transform 1.4s cubic-bezier(0.6, 0, 0.3, 1), opacity 1.4s ease;
  }
  .door-panel.left { left: 4px; clip-path: polygon(100% 0%, 100% 100%, 0% 100%, 0% 12%); border-right: 1px solid rgba(208,18,18,0.7); }
  .door-panel.right { right: 4px; clip-path: polygon(100% 12%, 100% 100%, 0% 100%, 0% 0%); border-left: 1px solid rgba(208,18,18,0.7); }

  .door-panel::before {
    content: '';
    position: absolute; inset: 14px;
    background-image:
      repeating-linear-gradient(0deg, rgba(208,18,18,0.28) 0px, rgba(208,18,18,0.28) 1px, transparent 1px, transparent 26px);
    opacity: 0.9;
  }

  #door-wrap.open .door-panel.left { transform: translateX(-115%); opacity: 0; }
  #door-wrap.open .door-panel.right { transform: translateX(115%); opacity: 0; }

  /* ============ FIGURE ============ */
  #nexus-wrap {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 280px;
    z-index: 10;
    text-align: center;
    transition: opacity 1.3s ease, transform 1.3s ease, filter 1.3s ease;
  }

  #nexusImg {
    width: 100%;
    height: auto;
    filter: drop-shadow(0 0 16px rgba(0,0,0,0.9));
    animation: nexus-breath 6s ease-in-out infinite;
  }
  @keyframes nexus-breath {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 16px rgba(0,0,0,0.9)); }
    50% { transform: scale(1.02); filter: drop-shadow(0 0 26px rgba(208,18,18,0.3)); }
  }

  #nexus-wrap.fading {
    opacity: 0;
    transform: translate(-50%, -70%) scale(1.06);
    filter: blur(6px);
  }

  .core-glow {
    position: absolute; top: 46%; left: 50%;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--crimson) 0%, transparent 70%);
    transform: translate(-50%, -50%);
    z-index: -1;
    opacity: 0.45;
  }

  .particle {
    position: absolute; top: 50%; left: 50%;
    width: var(--size, 3px); height: var(--size, 3px);
    background: var(--crimson);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--crimson), 0 0 12px var(--crimson);
    opacity: 0;
    animation: p-in var(--dur, 1.1s) cubic-bezier(0.55,0,0.85,0.35) forwards;
    z-index: 3;
  }
  @keyframes p-in {
    0% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.5); }
    12% { opacity: 1; } 80% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
  }
  #particle-container {
    position: absolute; inset: -300px;
    z-index: 3;
    pointer-events: none;
    transition: opacity 0.8s ease;
  }

  /* ============ UI PANEL ============ */
  #ui-panel {
    position: fixed;
    left: 50%;
    bottom: 46px;
    transform: translateX(-50%);
    z-index: 50;
    background: rgba(10,10,10,0.9);
    border: 1px solid #222;
    padding: 26px 30px;
    max-width: 520px;
    width: 90%;
    box-shadow: 0 0 30px rgba(0,0,0,0.9);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  #ui-panel.hidden {
    opacity: 0;
    transform: translateX(-50%) translateY(20px);
    pointer-events: none;
  }

  .warning-text {
    color: var(--crimson);
    font-size: 0.72rem;
    letter-spacing: 1.5px;
    display: block;
    margin-bottom: 16px;
    line-height: 1.6;
    font-weight: 700;
  }

  .terminal-btn {
    background: transparent;
    border: 1px solid var(--crimson);
    color: #fff;
    padding: 16px 32px;
    cursor: pointer;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: all 0.3s ease;
    box-shadow: 0 0 15px rgba(208,18,18,0.2);
    font-family: 'JetBrains Mono', monospace;
    width: 100%;
  }
  .terminal-btn:hover {
    background-color: var(--crimson);
    box-shadow: 0 0 30px rgba(208,18,18,0.8);
  }
  .btn-glitch-text { font-size: 0.95rem; font-weight: 800; letter-spacing: 2px; }
  .btn-subtext { font-size: 0.65rem; color: var(--text-dim); }
  .terminal-btn:hover .btn-subtext { color: #fff; }

  /* ============ WHITE-OUT FLASH ============ */
  #flash {
    position: fixed; inset: 0;
    background: radial-gradient(circle, #ffe6e6 0%, var(--crimson) 55%, #050505 100%);
    opacity: 0;
    z-index: 100;
    pointer-events: none;
    transition: opacity 0.9s ease;
  }
  #flash.on { opacity: 1; }

  /* ============ NEXT PAGE / DASHBOARD ============ */
  #dashboard {
    position: fixed; inset: 0;
    z-index: 60;
    background: #050505;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #d8d8d8;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease 0.3s;
  }
  #dashboard.visible {
    opacity: 1;
    pointer-events: auto;
  }
  #dashboard .content {
    text-align: center;
  }
  #dashboard .eyebrow {
    color: var(--crimson);
    font-size: 0.75rem;
    letter-spacing: 3px;
    margin-bottom: 10px;
  }
  #dashboard h1 {
    font-size: 1.6rem;
    letter-spacing: 1px;
    color: #fff;
    font-weight: 500;
    margin: 0 0 8px;
  }
  #dashboard p {
    color: var(--text-dim);
    font-size: 0.8rem;
  }

  .top-bar {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 14px 24px;
    font-size: 0.68rem;
    letter-spacing: 2px;
    color: var(--text-dim);
    z-index: 45;
  }
  .top-bar span { color: var(--crimson); }
</style>
</head>

</div>

<div id="flash"></div>

<div id="dashboard">
  <div class="content">
    <div class="eyebrow">ACCESS GRANTED</div>
    <h1>GHOSTWIRE // MAIN GRID</h1>
    <p>// 4-TOOL OSINT INTERFACE LOADED //</p>
  </div>
</div>

<div id="ui-panel">
  <span class="warning-text">[ WARNING: IGNORANCE IS A SHIELD. KNOWLEDGE IS A BURDEN. ]<br>DO YOU STILL WISH TO PROCEED? [ Y / N ]</span>
  <button class="terminal-btn" id="proceedBtn" onclick="beginSequence()">
    <span class="btn-glitch-text">[ ACCEPT &amp; PROCEED ]</span>
    <span class="btn-subtext">// SINGLE CLICK AUTHORIZATION</span>
  </button>
</div>

<script>
let streamInterval = null;

function spawnParticle() {
  const container = document.getElementById('particle-container');
  const p = document.createElement('div');
  p.className = 'particle';
  const angle = Math.random() * Math.PI * 2;
  const radius = 170 + Math.random() * 160;
  const dx = Math.cos(angle) * radius;
  const dy = Math.sin(angle) * radius;
  p.style.setProperty('--dx', dx.toFixed(1) + 'px');
  p.style.setProperty('--dy', dy.toFixed(1) + 'px');
  p.style.setProperty('--dur', (0.7 + Math.random() * 0.7).toFixed(2) + 's');
  p.style.setProperty('--size', (2 + Math.random() * 3).toFixed(1) + 'px');
  p.addEventListener('animationend', () => p.remove());
  container.appendChild(p);
}
function startParticles() {
  streamInterval = setInterval(() => { spawnParticle(); spawnParticle(); }, 60);
}
function stopParticles() {
  if (streamInterval) { clearInterval(streamInterval); streamInterval = null; }
  const c = document.getElementById('particle-container');
  c.style.opacity = '0';
}
startParticles();

function beginSequence() {
  const btn = document.getElementById('proceedBtn');
  const nexusWrap = document.getElementById('nexus-wrap');
  const doorWrap = document.getElementById('door-wrap');
  const uiPanel = document.getElementById('ui-panel');
  const scene = document.getElementById('scene');
  const flash = document.getElementById('flash');
  const dashboard = document.getElementById('dashboard');
  const statusText = document.getElementById('statusText');

  btn.style.pointerEvents = 'none';
  btn.querySelector('.btn-glitch-text').innerText = '[ ACCESS GRANTED ]';
  btn.style.backgroundColor = '#d01212';
  statusText.innerText = 'AUTHORIZED';

  // Step 1: fade the UI panel + figure, stop particle spawn
  uiPanel.classList.add('hidden');
  nexusWrap.classList.add('fading');
  stopParticles();

  // Step 2: once figure has mostly faded, open the door
  setTimeout(() => {
    doorWrap.classList.add('open');
  }, 900);

  // Step 3: push the camera through the opening doorway
  setTimeout(() => {
    scene.classList.add('zooming');
  }, 1500);

  // Step 4: white/crimson flash as we pass through
  setTimeout(() => {
    flash.classList.add('on');
  }, 3000);

  // Step 5: reveal the next page, fade the flash back out
  setTimeout(() => {
    dashboard.classList.add('visible');
    document.body.classList.remove('locked');
  }, 3400);

  setTimeout(() => {
    flash.classList.remove('on');
  }, 3900);
}
</script>
